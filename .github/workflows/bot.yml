name: Bot de trading
on:
  schedule:
    - cron: "45 12 * * 1-5"   # brief (heure d'été NY)
    - cron: "45 13 * * 1-5"   # brief (heure d'hiver NY)
    - cron: "46 13 * * 1-5"   # plan (heure d'été NY)
    - cron: "46 14 * * 1-5"   # plan (heure d'hiver NY)
    - cron: "0 8 * * 6"       # backtest chaque samedi
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire ?"
        type: choice
        options: [installer, backtest, brief, plan]
        default: installer
permissions:
  contents: write
